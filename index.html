<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <div id="config-screen" class="screen active">
            <h1>Juego de Trivia</h1>
            <form id="config-form">
                <div class="form-group">
                    <label for="player-name">Tu nombre:</label>
                    <input type="text" id="player-name" minlength="2" maxlength="20" required>
                    <span class="error-msg" id="name-error"></span>
                </div>
                    
                <div class="form-group">
                    <label for="question-count">Cantidad de preguntas:</label>
                    <input type="number" id="question-count" min="5" max="20" value="10">
                </div>
                
                <div class="form-group">
                    <label for="difficulty">Dificultad:</label>
                    <select id="difficulty">
                        <option value="">Mixto</option>
                        <option value="easy">Fácil</option>
                        <option value="medium">Medio</option>
                        <option value="hard">Difícil</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="category">Tematica:</label>
                    <select id="category">
                        <option value="">Todas las Tematicas</option>
                    </select>
                </div>
                
                <button type="submit" id="start-btn">Comenzar Juego</button>
            </form>
        </div>

        <div id="game-screen" class="screen">
            <div class="game-header">
                <span id="player-display"></span>
                <span id="score-display">Puntos: 0</span>
            </div>
            
            <div id="progress">Pregunta 1 de 10</div>
            
            <div id="timer-container">
                <div id="timer-bar"></div>
                <span id="time-left">20</span>
            </div>
            
            <div id="question-container">
                <h2 id="question-text"></h2>
                <div id="answers-container"></div>
            </div>
            
            <div id="loading" class="hidden">Cargando preguntas.</div>
        </div>

        <div id="results-screen" class="screen">
            <h2>Resultados Finales</h2>
            <div id="results-content"></div>
            <div class="results-buttons">
                <button id="play-again">Jugar Otra Vez</button>
                <button id="new-config">Nueva Configuracion</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
